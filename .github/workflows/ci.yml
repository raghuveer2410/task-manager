name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            task-manager-backend/package-lock.json
            task-manager-frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: task-manager-backend
        run: npm ci

      - name: Test backend
        working-directory: task-manager-backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: task-manager-frontend
        run: npm ci

      - name: Test frontend
        working-directory: task-manager-frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: task-manager-frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build backend image
        run: docker build -t task-manager-backend:ci ./task-manager-backend

      - name: Build frontend image
        run: docker build -t task-manager-frontend:ci ./task-manager-frontend
